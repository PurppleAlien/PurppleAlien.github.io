<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada · Antonio Soria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #080c11;
      color: #e2e8f0;
      font-family: 'Source Code Pro', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Scanlines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid bg */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(97,218,251,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(97,218,251,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 680px;
    }

    /* Glitch 404 */
    .err-code {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      color: #61dafb;
      line-height: 1;
      position: relative;
      display: inline-block;
      text-shadow: 0 0 30px rgba(97,218,251,0.4);
      animation: glitch404 6s infinite;
    }

    @keyframes glitch404 {
      0%, 90%, 100% { transform: translate(0); color: #61dafb; }
      91%  { transform: translate(-3px, 1px); color: #ff5f57; clip-path: polygon(0 15%, 100% 15%, 100% 40%, 0 40%); }
      92%  { transform: translate(3px, -1px); color: #c678dd; clip-path: polygon(0 60%, 100% 60%, 100% 85%, 0 85%); }
      93%  { transform: translate(-2px, 2px); color: #61dafb; clip-path: none; }
      94%  { transform: translate(0); }
    }

    .err-code::before,
    .err-code::after {
      content: '404';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      font-family: inherit; font-size: inherit; font-weight: inherit;
    }
    .err-code::before { color: #ff5f57; animation: glitchTop 6s infinite; }
    .err-code::after  { color: #c678dd; animation: glitchBot 6s infinite; }

    @keyframes glitchTop {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      91% { transform: translate(-4px, -2px); opacity: 0.7; clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); }
      93% { opacity: 0; }
    }
    @keyframes glitchBot {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      92% { transform: translate(4px, 2px); opacity: 0.7; clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); }
      94% { opacity: 0; }
    }

    .err-title {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #e6edf3;
      margin: 12px 0 8px;
      letter-spacing: 1px;
    }

    /* Terminal block */
    .err-terminal {
      background: #0d1117;
      border: 1px solid rgba(97,218,251,0.15);
      border-radius: 12px;
      padding: 20px 24px;
      margin: 28px auto;
      text-align: left;
      font-size: 0.82rem;
      line-height: 2;
      max-width: 500px;
    }

    .err-terminal .prompt { color: #00ff88; }
    .err-terminal .cmd    { color: #e6edf3; }
    .err-terminal .out    { color: rgba(97,218,251,0.6); }
    .err-terminal .red    { color: #f87171; }

    /* Blinking cursor */
    .cursor { animation: blink .8s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Buttons */
    .err-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: 10px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #61dafb, #3d85c6);
      color: #0d1117;
      box-shadow: 0 4px 18px rgba(97,218,251,0.3);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(97,218,251,0.5); }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(97,218,251,0.35);
      color: #61dafb;
    }
    .btn-outline:hover { background: rgba(97,218,251,0.08); border-color: #61dafb; transform: translateY(-3px); }

    /* Floating particles */
    .particle {
      position: fixed;
      font-family: 'Source Code Pro', monospace;
      color: rgba(97,218,251,0.06);
      user-select: none;
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* Neon bottom line */
    .neon-line {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #61dafb 30%, #c678dd 70%, transparent);
      opacity: 0.4;
    }
  </style>

  <!-- Analytics sin cookies (configura tu dominio en plausible.io) -->
  <script defer data-domain="antoniosoria.com" src="https://plausible.io/js/script.js"></script>
</head>
<body>

  <div class="container">
    <div class="err-code">404</div>
    <h1 class="err-title">Segmentation Fault — Página no encontrada</h1>

    <div class="err-terminal">
      <div><span class="prompt">$ </span><span class="cmd">cd </span><span class="red">página_que_buscas</span></div>
      <div><span class="out">bash: cd: página_que_buscas: No such file or directory</span></div>
      <div style="margin-top:6px"><span class="prompt">$ </span><span class="cmd">cat error.log</span></div>
      <div><span class="red">ERROR 404</span><span class="out"> — The requested resource does not exist.</span></div>
      <div><span class="out">Possible causes: wrong URL · page moved · link broken.</span></div>
      <div style="margin-top:6px"><span class="prompt">$ </span><span class="cursor">▋</span></div>
    </div>

    <div class="err-actions">
      <a href="index.html" class="btn btn-primary">
        <i class="fas fa-home"></i> Volver al inicio
      </a>
      <a href="portafolio.html" class="btn btn-outline">
        <i class="fas fa-code-branch"></i> Ver portafolio
      </a>
      <a href="contacto.html" class="btn btn-outline">
        <i class="fas fa-envelope"></i> Contactar
      </a>
    </div>
  </div>

  <div class="neon-line"></div>

  <script>
    // Floating code particles
    const symbols = ['{','}','[]','()','0x','01','if','for','fn','∑','∂','π','=>','&&','//','BFS','A*'];
    for (let i = 0; i < 22; i++) {
      const el = document.createElement('span');
      el.className = 'particle';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      const dur = 14 + Math.random() * 18;
      el.style.cssText = `left:${Math.random()*100}%;font-size:${0.7+Math.random()*0.7}rem;animation-duration:${dur}s;animation-delay:${-(Math.random()*dur)}s`;
      document.body.appendChild(el);
    }
  </script>
</body>
</html>
